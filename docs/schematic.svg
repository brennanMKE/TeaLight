<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1480" height="900" viewBox="0 0 1480 900" font-family="Helvetica, Arial, sans-serif">
  <title>IR Tea Light schematic</title>
  <defs>
    <style>
      .w { stroke: #1f2937; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .c { stroke: #111827; stroke-width: 2; fill: #ffffff; }
      .chip { stroke: #111827; stroke-width: 2; fill: #f1f5f9; }
      .panel { fill: #f9fafb; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .h { font-size: 16px; font-weight: bold; fill: #0f172a; }
      .t { font-size: 13px; fill: #111827; }
      .ref { font-size: 13px; font-weight: bold; fill: #111827; }
      .s { font-size: 11px; fill: #475569; }
      .pin { font-size: 11px; font-family: Menlo, Consolas, monospace; fill: #334155; }
      .pn { font-size: 10px; font-family: Menlo, Consolas, monospace; fill: #94a3b8; }
      .mono { font-size: 12px; font-family: Menlo, Consolas, monospace; fill: #1e293b; }
      .vbat { font-size: 12px; font-weight: bold; fill: #b91c1c; }
      .vbus { font-size: 12px; font-weight: bold; fill: #c2410c; }
      .flag { fill: #e0f2fe; stroke: #0369a1; stroke-width: 1.5; }
      .flagt { font-size: 11px; font-weight: bold; fill: #075985; text-anchor: middle; }
      .pad { fill: #fbbf24; stroke: #92400e; stroke-width: 1.5; }
      .dot { fill: #1f2937; }
    </style>
    <g id="gnd" class="w">
      <line x1="-12" y1="0" x2="12" y2="0"/>
      <line x1="-8" y1="5" x2="8" y2="5"/>
      <line x1="-4" y1="10" x2="4" y2="10"/>
    </g>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1480" height="900" fill="#ffffff"/>

  <!-- Title -->
  <text x="20" y="38" font-size="22" font-weight="bold" fill="#0f172a">IR Tea Light: Schematic</text>
  <text x="20" y="58" class="s">ATtiny85 · MCP73831 · TSOP75238 · rev 0.1, drawn from tea-light-design.md. Net labels with the same name are connected.</text>

  <!-- ============ Panel A: Power & charging ============ -->
  <rect class="panel" x="20" y="70" width="770" height="410" rx="8"/>
  <text class="h" x="36" y="94">Power &amp; charging</text>

  <!-- J1 USB-C -->
  <rect class="chip" x="50" y="130" width="90" height="160" rx="4"/>
  <text class="ref" x="95" y="122" text-anchor="middle">J1 USB-C</text>
  <text class="pin" x="132" y="154" text-anchor="end">VBUS</text>
  <text class="pin" x="132" y="194" text-anchor="end">CC1</text>
  <text class="pin" x="132" y="234" text-anchor="end">CC2</text>
  <text class="pin" x="132" y="274" text-anchor="end">GND</text>
  <text class="s" x="95" y="306" text-anchor="middle">6-pin, power only</text>

  <!-- VBUS -->
  <path class="w" d="M140 150 H400"/>
  <text class="vbus" x="230" y="143" text-anchor="middle">VBUS</text>

  <!-- CC1 / R1 -->
  <path class="w" d="M140 190 H260 V275"/>
  <rect class="c" x="255" y="275" width="10" height="30"/>
  <path class="w" d="M260 305 V320"/>
  <use xlink:href="#gnd" x="260" y="320"/>
  <text class="ref" x="270" y="288">R1</text>
  <text class="s" x="270" y="301">5.1k</text>

  <!-- CC2 / R2 -->
  <path class="w" d="M140 230 H200 V275"/>
  <rect class="c" x="195" y="275" width="10" height="30"/>
  <path class="w" d="M200 305 V320"/>
  <use xlink:href="#gnd" x="200" y="320"/>
  <text class="ref" x="210" y="288">R2</text>
  <text class="s" x="210" y="301">5.1k</text>

  <!-- J1 GND -->
  <path class="w" d="M140 270 H160 V320"/>
  <use xlink:href="#gnd" x="160" y="320"/>

  <!-- Tray pads + D3 -->
  <circle class="pad" cx="70" cy="400" r="7"/>
  <text class="s" x="70" y="422" text-anchor="middle">VBUS pad</text>
  <path class="w" d="M77 400 H120"/>
  <polygon class="c" points="120,390 120,410 140,400"/>
  <path class="w" d="M134 392 V388 H140 V412 H146 V408"/>
  <path class="w" d="M140 400 H310 V150"/>
  <circle class="dot" cx="310" cy="150" r="4"/>
  <text class="ref" x="130" y="382" text-anchor="middle">D3 BAT54</text>
  <circle class="pad" cx="70" cy="452" r="7"/>
  <text class="s" x="70" y="474" text-anchor="middle">GND pad</text>
  <path class="w" d="M77 452 H115 V458"/>
  <use xlink:href="#gnd" x="115" y="458"/>
  <text class="s" x="160" y="430">Optional charging-tray pogo pads</text>
  <text class="s" x="160" y="444">(D3 keeps exposed pad off USB VBUS)</text>

  <!-- C1 -->
  <circle class="dot" cx="350" cy="150" r="4"/>
  <path class="w" d="M350 150 V185 M335 185 H365 M335 195 H365 M350 195 V215"/>
  <use xlink:href="#gnd" x="350" y="215"/>
  <text class="ref" x="362" y="240">C1</text>
  <text class="s" x="362" y="253">4.7µF</text>

  <!-- U2 MCP73831 -->
  <rect class="chip" x="400" y="130" width="150" height="180" rx="4"/>
  <text class="ref" x="475" y="122" text-anchor="middle">U2 MCP73831T-2ACI/OT</text>
  <text class="pin" x="408" y="154">VIN</text>
  <text class="pin" x="408" y="274">VSS</text>
  <text class="pin" x="542" y="154" text-anchor="end">VBAT</text>
  <text class="pin" x="542" y="214" text-anchor="end">STAT</text>
  <text class="pin" x="542" y="274" text-anchor="end">PROG</text>
  <text class="pn" x="392" y="145" text-anchor="end">4</text>
  <text class="pn" x="392" y="265" text-anchor="end">2</text>
  <text class="pn" x="558" y="145">3</text>
  <text class="pn" x="558" y="205">1</text>
  <text class="pn" x="558" y="265">5</text>
  <text class="s" x="475" y="200" text-anchor="middle">1S LiPo charger</text>
  <text class="s" x="475" y="214" text-anchor="middle">4.2 V</text>
  <path class="w" d="M400 270 H380 V290"/>
  <use xlink:href="#gnd" x="380" y="290"/>
  <text class="s" x="475" y="350" text-anchor="middle">I_charge = 1000 V / R_PROG ≈ 100 mA</text>

  <!-- VBAT out -->
  <path class="w" d="M550 150 H720"/>
  <text class="vbat" x="600" y="143" text-anchor="middle">VBAT</text>

  <!-- STAT flag -->
  <path class="w" d="M550 210 H570"/>
  <rect class="flag" x="570" y="200" width="56" height="20" rx="4"/>
  <text class="flagt" x="598" y="214">STAT</text>

  <!-- PROG / R3 -->
  <path class="w" d="M550 270 H580 V280"/>
  <rect class="c" x="575" y="280" width="10" height="30"/>
  <path class="w" d="M580 310 V325"/>
  <use xlink:href="#gnd" x="580" y="325"/>
  <text class="ref" x="592" y="293">R3</text>
  <text class="s" x="592" y="306">10k</text>

  <!-- C2 -->
  <circle class="dot" cx="650" cy="150" r="4"/>
  <path class="w" d="M650 150 V185 M635 185 H665 M635 195 H665 M650 195 V215"/>
  <use xlink:href="#gnd" x="650" y="215"/>
  <text class="ref" x="670" y="240">C2</text>
  <text class="s" x="670" y="253">4.7µF</text>

  <!-- SW1 + BT1 -->
  <path class="w" d="M720 150 V175"/>
  <circle class="c" cx="720" cy="178" r="3"/>
  <circle class="c" cx="720" cy="212" r="3"/>
  <path class="w" d="M720 209 L736 182"/>
  <path class="w" d="M720 215 V240"/>
  <text class="ref" x="742" y="198">SW1</text>
  <text class="s" x="742" y="211">(opt)</text>
  <path d="M705 240 H735" stroke="#111827" stroke-width="2"/>
  <path d="M712 250 H728" stroke="#111827" stroke-width="5"/>
  <text class="t" x="742" y="244">+</text>
  <path class="w" d="M720 252 V280"/>
  <use xlink:href="#gnd" x="720" y="280"/>
  <text class="ref" x="720" y="312" text-anchor="middle">BT1 LiPo 1S</text>
  <text class="s" x="720" y="326" text-anchor="middle">100–200 mAh</text>
  <text class="s" x="720" y="339" text-anchor="middle">with PCM</text>

  <!-- ============ Panel B: MCU ============ -->
  <rect class="panel" x="810" y="70" width="650" height="410" rx="8"/>
  <text class="h" x="826" y="94">MCU</text>

  <rect class="chip" x="1060" y="150" width="170" height="210" rx="4"/>
  <text class="ref" x="1145" y="142" text-anchor="middle">U1 ATtiny85-20SU</text>
  <text class="pin" x="1068" y="184">PB5/RST</text>
  <text class="pin" x="1068" y="234">PB3</text>
  <text class="pin" x="1068" y="284">PB4</text>
  <text class="pin" x="1068" y="334">GND</text>
  <text class="pin" x="1222" y="184" text-anchor="end">VCC</text>
  <text class="pin" x="1222" y="234" text-anchor="end">PB2/INT0</text>
  <text class="pin" x="1222" y="284" text-anchor="end">PB1/OC0B</text>
  <text class="pin" x="1222" y="334" text-anchor="end">PB0/OC0A</text>
  <text class="pn" x="1052" y="175" text-anchor="end">1</text>
  <text class="pn" x="1052" y="225" text-anchor="end">2</text>
  <text class="pn" x="1052" y="275" text-anchor="end">3</text>
  <text class="pn" x="1052" y="325" text-anchor="end">4</text>
  <text class="pn" x="1238" y="175">8</text>
  <text class="pn" x="1238" y="225">7</text>
  <text class="pn" x="1238" y="275">6</text>
  <text class="pn" x="1238" y="325">5</text>

  <!-- RESET + R4 -->
  <path class="w" d="M1060 180 H880"/>
  <circle class="dot" cx="980" cy="180" r="4"/>
  <path class="w" d="M980 180 V160"/>
  <rect class="c" x="975" y="130" width="10" height="30"/>
  <path class="w" d="M980 130 V112"/>
  <text class="vbat" x="980" y="106" text-anchor="middle">VBAT</text>
  <text class="ref" x="992" y="143">R4</text>
  <text class="s" x="992" y="156">10k</text>
  <rect class="flag" x="830" y="170" width="50" height="20" rx="4"/>
  <text class="flagt" x="855" y="184">RESET</text>

  <!-- PB3 STAT -->
  <path class="w" d="M1060 230 H900"/>
  <rect class="flag" x="844" y="220" width="56" height="20" rx="4"/>
  <text class="flagt" x="872" y="234">STAT</text>
  <text class="s" x="980" y="223" text-anchor="middle">low = charging</text>

  <!-- PB4 spare -->
  <path class="w" d="M1060 280 H920"/>
  <circle class="pad" cx="914" cy="280" r="6"/>
  <text class="s" x="900" y="284" text-anchor="end">TP1 spare</text>

  <!-- GND -->
  <path class="w" d="M1060 330 H1030 V345"/>
  <use xlink:href="#gnd" x="1030" y="345"/>

  <!-- VCC + C3 -->
  <path class="w" d="M1230 180 H1440"/>
  <text class="vbat" x="1440" y="173" text-anchor="end">VBAT</text>
  <circle class="dot" cx="1400" cy="180" r="4"/>
  <path class="w" d="M1400 180 V200 M1385 200 H1415 M1385 210 H1415 M1400 210 V230"/>
  <use xlink:href="#gnd" x="1400" y="230"/>
  <text class="ref" x="1420" y="208">C3</text>
  <text class="s" x="1420" y="221">100n</text>

  <!-- Right flags -->
  <path class="w" d="M1230 230 H1260"/>
  <rect class="flag" x="1260" y="220" width="64" height="20" rx="4"/>
  <text class="flagt" x="1292" y="234">IR_OUT</text>
  <path class="w" d="M1230 280 H1260"/>
  <rect class="flag" x="1260" y="270" width="50" height="20" rx="4"/>
  <text class="flagt" x="1285" y="284">LED2</text>
  <path class="w" d="M1230 330 H1260"/>
  <rect class="flag" x="1260" y="320" width="50" height="20" rx="4"/>
  <text class="flagt" x="1285" y="334">LED1</text>

  <text class="s" x="1145" y="392" text-anchor="middle">Runs directly from VBAT (3.0–4.2 V), no regulator</text>
  <text class="s" x="1145" y="408" text-anchor="middle">Fuses: internal 8 MHz, BOD 2.7 V, EESAVE</text>
  <text class="s" x="1145" y="424" text-anchor="middle">VCC measured via internal 1.1 V bandgap (no ADC pin used)</text>

  <!-- ============ Panel C: IR receiver ============ -->
  <rect class="panel" x="20" y="500" width="470" height="380" rx="8"/>
  <text class="h" x="36" y="524">IR receiver</text>

  <text class="vbat" x="72" y="584" text-anchor="end">VBAT</text>
  <path class="w" d="M78 580 H120"/>
  <rect class="c" x="120" y="575" width="30" height="10"/>
  <text class="ref" x="135" y="567" text-anchor="middle">R5 100Ω</text>
  <path class="w" d="M150 580 H280"/>
  <circle class="dot" cx="210" cy="580" r="4"/>
  <path class="w" d="M210 580 V615 M195 615 H225 M195 625 H225 M210 625 V650"/>
  <use xlink:href="#gnd" x="210" y="650"/>
  <text class="ref" x="190" y="616" text-anchor="end">C4</text>
  <text class="s" x="190" y="630" text-anchor="end">4.7µF</text>

  <rect class="chip" x="280" y="560" width="120" height="110" rx="4"/>
  <text class="ref" x="340" y="552" text-anchor="middle">U3 TSOP75238TT</text>
  <text class="pin" x="288" y="584">VS</text>
  <text class="pin" x="288" y="654">GND</text>
  <text class="pin" x="392" y="619" text-anchor="end">OUT</text>
  <text class="pn" x="272" y="575" text-anchor="end">2</text>
  <text class="pn" x="272" y="645" text-anchor="end">1,4</text>
  <text class="pn" x="404" y="610">3</text>
  <path class="w" d="M280 650 H255 V665"/>
  <use xlink:href="#gnd" x="255" y="665"/>
  <path class="w" d="M400 615 H412"/>
  <rect class="flag" x="412" y="605" width="64" height="20" rx="4"/>
  <text class="flagt" x="444" y="619">IR_OUT</text>

  <text class="s" x="40" y="720">38 kHz NEC, top-view SMD (TT suffix). OUT has an internal pull-up.</text>
  <text class="s" x="40" y="738">R5/C4 filter keeps LED PWM noise off the receiver supply.</text>
  <text class="s" x="40" y="756">Keep ≥ 3 mm from the LEDs; confirm 940 nm passes the diffuser.</text>

  <!-- ============ Panel D: LEDs ============ -->
  <rect class="panel" x="510" y="500" width="430" height="380" rx="8"/>
  <text class="h" x="526" y="524">LEDs (flame)</text>

  <!-- D1 -->
  <rect class="flag" x="530" y="580" width="50" height="20" rx="4"/>
  <text class="flagt" x="555" y="594">LED1</text>
  <path class="w" d="M580 590 H630"/>
  <rect class="c" x="630" y="585" width="30" height="10"/>
  <text class="ref" x="645" y="577" text-anchor="middle">R6 150Ω</text>
  <path class="w" d="M660 590 H720"/>
  <polygon class="c" points="720,578 720,602 742,590"/>
  <path class="w" d="M742 578 V602"/>
  <path d="M732 574 L744 562" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M740 578 L752 566" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="ref" x="731" y="622" text-anchor="middle">D1</text>
  <text class="s" x="731" y="636" text-anchor="middle">warm white</text>
  <path class="w" d="M742 590 H800 V610"/>
  <use xlink:href="#gnd" x="800" y="610"/>

  <!-- D2 -->
  <rect class="flag" x="530" y="690" width="50" height="20" rx="4"/>
  <text class="flagt" x="555" y="704">LED2</text>
  <path class="w" d="M580 700 H630"/>
  <rect class="c" x="630" y="695" width="30" height="10"/>
  <text class="ref" x="645" y="687" text-anchor="middle">R7 150Ω</text>
  <path class="w" d="M660 700 H720"/>
  <polygon class="c" points="720,688 720,712 742,700"/>
  <path class="w" d="M742 688 V712"/>
  <path d="M732 684 L744 672" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M740 688 L752 676" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="ref" x="731" y="732" text-anchor="middle">D2</text>
  <text class="s" x="731" y="746" text-anchor="middle">warm white</text>
  <path class="w" d="M742 700 H800 V720"/>
  <use xlink:href="#gnd" x="800" y="720"/>

  <text class="s" x="530" y="790">~3–8 mA per LED, driven directly from GPIO (no MOSFET).</text>
  <text class="s" x="530" y="808">Timer0 PWM on OC0A/OC0B; flicker scaled by measured VCC.</text>
  <text class="s" x="530" y="826">~2200 K or amber, 0603 / PLCC-2 3528, at board center.</text>

  <!-- ============ Panel E: ISP ============ -->
  <rect class="panel" x="960" y="500" width="500" height="380" rx="8"/>
  <text class="h" x="976" y="524">ISP pads (bottom, 2×3 @ 2.54 mm)</text>

  <circle class="pad" cx="1000" cy="570" r="11"/><text class="pin" x="1000" y="574" text-anchor="middle">1</text>
  <circle class="pad" cx="1040" cy="570" r="11"/><text class="pin" x="1040" y="574" text-anchor="middle">2</text>
  <circle class="pad" cx="1000" cy="610" r="11"/><text class="pin" x="1000" y="614" text-anchor="middle">3</text>
  <circle class="pad" cx="1040" cy="610" r="11"/><text class="pin" x="1040" y="614" text-anchor="middle">4</text>
  <circle class="pad" cx="1000" cy="650" r="11"/><text class="pin" x="1000" y="654" text-anchor="middle">5</text>
  <circle class="pad" cx="1040" cy="650" r="11"/><text class="pin" x="1040" y="654" text-anchor="middle">6</text>

  <text class="mono" x="1090" y="564">1  MISO   → PB1 (LED2)</text>
  <text class="mono" x="1090" y="584">2  VCC    → VBAT</text>
  <text class="mono" x="1090" y="604">3  SCK    → PB2 (IR_OUT)</text>
  <text class="mono" x="1090" y="624">4  MOSI   → PB0 (LED1)</text>
  <text class="mono" x="1090" y="644">5  RESET  → PB5 (RESET)</text>
  <text class="mono" x="1090" y="664">6  GND    → GND</text>

  <text class="s" x="976" y="712">Standard AVR 6-pin ISP order; pogo-pin jig or Tag-Connect TC2030.</text>
  <text class="s" x="976" y="730">Programming lines are shared with the LEDs and the TSOP output.</text>
  <text class="s" x="976" y="748">If programming is unreliable, add 1 kΩ series resistors between</text>
  <text class="s" x="976" y="764">the pads and PB0/PB1/PB2, or program before fitting U3.</text>

  <rect class="flag" x="976" y="800" width="56" height="20" rx="4"/>
  <text class="flagt" x="1004" y="814">NET</text>
  <text class="s" x="1042" y="814">net label: same name = same net</text>
  <circle class="pad" cx="1260" cy="810" r="7"/>
  <text class="s" x="1274" y="814">pad / test point</text>
</svg>
